<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Cart - ByteBites</title><style>body{font-family:Arial;background:#f1f8e9;margin:0}.head{background:#1b5e20;color:white;padding:20px;display:flex;justify-content:space-between}.head a{color:#fff;margin:10px}.box{width:90%;max-width:850px;margin:40px auto;background:#fff;padding:25px;border-radius:15px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:15px}.btn{padding:8px;border:0;border-radius:5px}.remove{background:#c62828;color:#fff}.checkout{display:block;background:#2e7d32;color:#fff;text-align:center;padding:14px;text-decoration:none;border-radius:8px;margin-top:20px}</style></head><body><div class="head"><b>🍴🌱 ByteBites</b><div><a th:href="@{/}">Home</a><a th:href="@{/menu}">Menu</a></div></div><div class="box"><h1>🛒 Your Cart</h1><div th:if="${items != null and !items.isEmpty()}"><div class="item" th:each="i:${items}"><div><b th:text="${i.food.foodName}"></b><br>₹<span th:text="${i.food.price}"></span> × <span th:text="${i.quantity}"></span><br>Subtotal: ₹<span th:text="${i.subtotal}"></span></div><div><form style="display:inline" th:action="@{/cart/decrease}" method="post"><input type="hidden" name="cartItemId" th:value="${i.cartItemId}"><button class="btn">−</button></form><form style="display:inline" th:action="@{/cart/increase}" method="post"><input type="hidden" name="cartItemId" th:value="${i.cartItemId}"><button class="btn">+</button></form><form style="display:inline" th:action="@{/cart/remove}" method="post"><input type="hidden" name="cartItemId" th:value="${i.cartItemId}"><button class="btn remove">Remove</button></form></div></div><h2 style="text-align:right">Total: ₹<span th:text="${total}"></span></h2><a class="checkout" th:href="@{/checkout}">Proceed to Checkout</a></div><div th:unless="${items != null and !items.isEmpty()}">Your cart is empty. <a th:href="@{/menu}">Browse Menu</a></div></div></body></html>
