<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ByteBites - Menu</title><style>body{font-family:Arial;margin:0;background:#f1f8e9;color:#333}header{background:#1b5e20;color:#fff;padding:18px 40px;display:flex;justify-content:space-between}header a{color:#fff;text-decoration:none;margin:0 10px}.search,.climate{text-align:center;padding:20px}.search input{padding:12px;width:50%}.search button,.review button{padding:12px;background:#2e7d32;color:#fff;border:0;border-radius:6px}.climate a{display:inline-block;background:#fff;color:#2e7d32;padding:10px 15px;margin:5px;border-radius:20px;text-decoration:none}.grid{width:92%;max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}.card{background:#fff;padding:22px;border-radius:15px;box-shadow:0 4px 15px #0002}.name{font-size:24px;font-weight:bold;color:#2e7d32}.price{font-size:22px;color:#e65100;font-weight:bold;margin:15px 0}.actions{display:flex;gap:8px}.actions form{flex:1}.actions button{width:100%;padding:12px;border:0;border-radius:7px;color:#fff;font-weight:bold}.cart{background:#388e3c}.buy{background:#ef6c00}.review{border-top:1px solid #ddd;margin-top:20px;padding-top:15px}.review input,.review textarea,.review select{width:100%;padding:9px;margin:5px 0;box-sizing:border-box}</style></head><body><header><strong>🍴🌱 ByteBites</strong><nav><a th:href="@{/}">Home</a><a th:href="@{/menu}">Menu</a><a th:href="@{/cart}">Cart (<span th:text="${cartCount}">0</span>)</a></nav></header><div class="search"><form th:action="@{/menu}" method="get"><input name="search" placeholder="Search food, category, climate..." th:value="${search}"><button>Search</button></form></div><div class="climate"><a th:href="@{/menu(climate='Sunny')}">☀️ Sunny</a><a th:href="@{/menu(climate='Winter')}">❄️ Winter</a><a th:href="@{/menu(climate='Humid')}">💧 Humid</a><a th:href="@{/menu(climate='Rainy')}">🌧️ Rainy</a><a th:href="@{/menu(climate='Cloudy')}">☁️ Cloudy</a><a th:href="@{/menu}">All Foods</a></div><h1 style="text-align:center;color:#1b5e20">🍴 Our Food Menu</h1><div class="grid" th:if="${foods != null and !foods.isEmpty()}"><div class="card" th:each="food:${foods}"><div class="name" th:text="${food.foodName}">Food</div><p><b>Category:</b> <span th:text="${food.category}"></span></p><p><b>Climate:</b> <span th:text="${food.climate}"></span></p><div class="price">₹<span th:text="${food.price}"></span></div><p th:text="${food.description}"></p><p><b>Availability:</b> <span th:text="${food.availability}"></span></p><div class="actions"><form th:action="@{/cart/add}" method="post"><input type="hidden" name="foodId" th:value="${food.foodId}"><button class="cart">🛒 Add to Cart</button></form><form th:action="@{/buy-now}" method="post"><input type="hidden" name="foodId" th:value="${food.foodId}"><button class="buy">📋 Buy Now</button></form></div><div class="review"><h3>⭐ Reviews</h3><div th:each="r:${reviewsMap.get(food.foodId)}"><b th:text="${r.customerName}"></b> - ⭐<span th:text="${r.rating}"></span><p th:text="${r.reviewText}"></p></div><form th:action="@{/review}" method="post"><input type="hidden" name="foodId" th:value="${food.foodId}"><input name="customerName" placeholder="Your name" required><select name="rating" required><option value="">Rating</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><textarea name="reviewText" placeholder="Write review" required></textarea><button>Submit Review</button></form></div></div></div><div th:unless="${foods != null and !foods.isEmpty()}" style="text-align:center;padding:50px">No food found.</div></body></html>
