<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Payment - ByteBites</title><script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script><style>body{font-family:Arial;background:#f1f8e9}.box{width:420px;margin:80px auto;background:#fff;padding:35px;text-align:center;border-radius:15px}.btn{width:100%;padding:15px;background:#2e7d32;color:white;border:0;border-radius:8px;font-size:18px}</style></head><body><div class="box"><h1>💳 Payment</h1><p>Order ID: <b th:text="${cashfreeOrderId}"></b></p><h2>₹<span th:text="${amount}"></span></h2><button id="payButton" class="btn">💰 Proceed to Pay</button></div><script th:inline="javascript">const paymentSessionId=/*[[${paymentSessionId}]]*/'';const cashfree=Cashfree({mode:'sandbox'});document.getElementById('payButton').onclick=()=>{if(!paymentSessionId){alert('Payment session was not created.');return;}cashfree.checkout({paymentSessionId:paymentSessionId,redirectTarget:'_self'});};</script></body></html>
