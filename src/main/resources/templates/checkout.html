<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Checkout - ByteBites</title><style>body{font-family:Arial;background:#f1f8e9}.box{width:90%;max-width:500px;margin:60px auto;background:#fff;padding:35px;border-radius:18px}input{width:100%;padding:13px;margin:8px 0 18px;box-sizing:border-box}.btn{width:100%;padding:15px;background:#2e7d32;color:#fff;border:0;border-radius:8px;font-size:17px}</style></head><body><div class="box"><h1 style="color:#2e7d32;text-align:center">💳 Checkout</h1><form th:action="@{/checkout}" method="post"><label>Customer Name</label><input name="customerName" required><label>Phone Number</label><input name="phoneNumber" maxlength="10" pattern="[0-9]{10}" required><p>🔒 Cashfree Sandbox payment</p><button class="btn">💰 Proceed to Payment</button></form><p style="text-align:center"><a th:href="@{/cart}">← Back to Cart</a></p></div></body></html>
